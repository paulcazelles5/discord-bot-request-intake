# Railway config for the Discord request bot (worker — no HTTP server)
# Install/start details are also in nixpacks.toml (overrides frozen-lockfile).
[build]
builder = "nixpacks"
buildCommand = "pnpm install --filter @workspace/scripts... --filter @workspace/db... --no-frozen-lockfile"

[deploy]
startCommand = "sh -c 'pnpm --filter @workspace/db run push-force || true; pnpm start'"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
# Discord bots are long-running workers; they do not bind an HTTP port.
# Settings → Networking → disable public networking if enabled.
