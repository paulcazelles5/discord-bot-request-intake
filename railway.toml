# Railway config for the Discord request bot (worker — no HTTP server)
[build]
builder = "nixpacks"
# Install bot + db workspaces (and their deps). Avoid frozen lockfile hard-fail.
buildCommand = "corepack enable && pnpm install --filter @workspace/scripts... --filter @workspace/db..."

[deploy]
# Create/update tables on fresh Postgres (ignore failure), then start the bot.
startCommand = "sh -c 'pnpm --filter @workspace/db run push-force || true; pnpm start'"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
# Discord bots are long-running workers; they do not bind an HTTP port.
# In Railway UI: Settings → Networking → disable public networking if enabled,
# and use a Worker service (or ignore healthcheck / set healthcheckPath empty).

[nixpacks]
# packageManager field in package.json selects pnpm via corepack
